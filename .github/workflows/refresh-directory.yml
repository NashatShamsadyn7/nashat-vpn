name: Refresh VPN directory

# Rebuilds directory/community.json daily from open-source node lists.
# Full-world pass + Europe deep pass. Only countries whose nodes passed
# FULL tunnel verification are kept. Every installed app fetches this file.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily (full world)
    - cron: '0 5 * * *'   # 05:00 UTC daily (Europe deep pass)
  workflow_dispatch: {}    # manual run button

permissions:
  contents: write

jobs:
  world:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build fresh world directory
        run: node directory/fetch-community.js
      - name: Commit if changed
        run: |
          git config user.name "nashat-vpn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add directory/community.json
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "chore: refresh world directory ($(date -u +%F))"; git push; fi

  europe:
    if: github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Europe deep verification pass
        run: node scripts/build-europe.js 6
      - name: Commit if changed
        run: |
          git config user.name "nashat-vpn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add directory/community.json
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "chore: Europe deep pass ($(date -u +%F))"; git push; fi
